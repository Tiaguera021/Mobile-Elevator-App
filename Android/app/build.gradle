plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.example.elevatordisplay'
    compileSdk 36

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.example.elevatordisplay"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "MQTT_BROKER_HOST", localProperties.getProperty("MQTT_BROKER_HOST", '"broker.hivemq.com"')
        buildConfigField "String", "MQTT_TOPIC_COMMAND", localProperties.getProperty("MQTT_TOPIC_COMMAND", '""')
        buildConfigField "String", "MQTT_TOPIC_STATUS", localProperties.getProperty("MQTT_TOPIC_STATUS", '""')
        buildConfigField "int", "MQTT_PORT", localProperties.getProperty("MQTT_PORT", '"');
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.hivemq:hivemq-mqtt-client:1.3.3'
}